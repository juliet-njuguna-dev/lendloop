# Local n8n for LendLoop. Pin the image tag to a tested version before relying on this.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env.n8n            # secrets live here (gitignored), never in this file
    environment:
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false   # lets Code nodes read $env (secret, Convex URL)
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto   # needed for HMAC
      - GENERIC_TIMEZONE=Africa/Nairobi
      - TZ=Africa/Nairobi
      - N8N_SECURE_COOKIE=false              # local http only; remove behind HTTPS
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
